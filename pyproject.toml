[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-drift-monitoring"
version = "0.1.0"
description = "PSI feature drift, monthly PR-AUC and a retrain trigger for a churn model (CH06)."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
